{% extends 'plantillaPrincipal.html' %}
{% load static %}

{% block contenido %}
<section class="py-5">
  <div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold" style="color:var(--color-primario, #1a3a6b);">
        <i class="bi bi-building me-2"></i>Departamentos
      </h2>
      <a href="/departamentos/nuevo/" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Nuevo Departamento
      </a>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <table id="tabla" class="table table-bordered table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            {% for item in items %}
            <tr>
              <td>{{ item.id }}</td>
              <td>{{ item.nombre }}</td>
              <td class="text-center">
                <a href="/departamentos/editar/{{ item.id }}/"
                   class="btn btn-sm btn-warning me-1">
                  <i class="bi bi-pencil-square"></i>
                </a>
                <button class="btn btn-sm btn-danger"
                        onclick="confirmarEliminar('/departamentos/eliminar/{{ item.id }}/')">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="text-center text-muted">No hay departamentos registrados.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>

  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  $(document).ready(function () { $('#tabla').DataTable({ language: { url: '' } }); });
</script>
{% endblock %}
