{% extends 'plantillaPrincipal.html' %}
{% load static %}

{% block contenido %}
<section class="py-5">
  <div class="container mt-4" style="max-width:520px;">

    <h2 class="fw-bold mb-4" style="color:#0077b6;">
      <i class="bi bi-building me-2"></i>{{ accion }} Departamento
    </h2>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">

        {% if accion == 'Editar' %}
          <form method="post" action="/departamentos/actualizar/{{ item.id }}/" id="formDep">
        {% else %}
          <form method="post" action="/departamentos/guardar/" id="formDep">
        {% endif %}
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
            <input type="text" name="nombre" class="form-control"
                   value="{% if item %}{{ item.nombre }}{% endif %}"
                   placeholder="Ej: Registro Civil"
                   minlength="2" maxlength="100" required>
            <div class="form-text">Solo letras y espacios, sin números.</div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>
              {% if accion == 'Editar' %}Actualizar{% else %}Guardar{% endif %}
            </button>
            <a href="/departamentos/" class="btn btn-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>

        </form>
      </div>
    </div>

  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  $('#formDep').validate({
    rules: {
      nombre: { required: true, minlength: 2, soloLetras: true, noRepetido: true }
    },
    messages: {
      nombre: { required: 'El nombre es obligatorio.', minlength: 'Mínimo 2 caracteres.' }
    },
    submitHandler: function (form) { form.submit(); }
  });
</script>
{% endblock %}
