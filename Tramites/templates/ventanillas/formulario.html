{% extends 'plantillaPrincipal.html' %}
{% load static %}

{% block contenido %}
<section class="py-5">
  <div class="container mt-4" style="max-width:580px;">

    <h2 class="fw-bold mb-4" style="color:var(--color-primario, #1a3a6b);">
      <i class="bi bi-door-open me-2"></i>{{ accion }} Ventanilla
    </h2>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">

        {% if accion == 'Editar' %}
          <form method="post" action="/ventanillas/actualizar/{{ item.id }}/" id="formVent">
        {% else %}
          <form method="post" action="/ventanillas/guardar/" id="formVent">
        {% endif %}
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Número <span class="text-danger">*</span></label>
            <input type="number" name="numero" class="form-control"
                   value="{% if item %}{{ item.numero }}{% endif %}"
                   min="1" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Descripción</label>
            <input type="text" name="descripcion" class="form-control"
                   value="{% if item %}{{ item.descripcion }}{% endif %}"
                   maxlength="200">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Departamento</label>
            <select name="departamento" class="form-select">
              <option value="">— Sin departamento —</option>
              {% for dep in departamentos %}
              <option value="{{ dep.id }}"
                {% if item and item.departamento_id == dep.id %}selected{% endif %}>
                {{ dep.nombre }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3 form-check form-switch">
            <input type="checkbox" name="activa" class="form-check-input" id="chkActiva"
                   {% if not item or item.activa %}checked{% endif %}>
            <label class="form-check-label" for="chkActiva">Ventanilla activa</label>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>
              {% if accion == 'Editar' %}Actualizar{% else %}Guardar{% endif %}
            </button>
            <a href="/ventanillas/" class="btn btn-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>

        </form>
      </div>
    </div>

  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  $('#formVent').validate({
    rules:      { numero: { required: true, min: 1, digits: true } },
    errorClass: 'text-danger small',
    highlight:   function(el){ $(el).addClass('is-invalid'); },
    unhighlight: function(el){ $(el).removeClass('is-invalid').addClass('is-valid'); },
    submitHandler: function(form){ form.submit(); }
  });
</script>
{% endblock %}
